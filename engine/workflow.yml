name: Build traceable OpenSCAD engine
on:
  workflow_dispatch:
  push:
    paths: ['engine/**', '.github/workflows/engine.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ENGINE_SOURCE_REF: dc2ff913b4193b1ebfef863da3f7e84f8fbc1e11
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Fetch exact build inputs
        run: bash engine/build.sh fetch
      - name: Capture source and provenance
        run: bash engine/build.sh capture
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source
          path: output/
          compression-level: 0
      - name: Build dependency environment
        run: bash engine/build.sh base
      - name: Build browser engine
        run: bash engine/build.sh engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-and-build-records
          path: output/
          compression-level: 0
